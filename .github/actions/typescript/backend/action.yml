name: Backend checks
description: Checks, builds, and tests the TypeScript backend.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup/bun
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: ./.github/actions/setup/install-dpm
    - name: Check backend
      shell: bash
      working-directory: quickstart/backend-ts
      run: |
        bun run lint
        bun run format:check
        bun run build
        bun run test
    - name: Check backward compatibility
      shell: bash
      working-directory: quickstart/backend-ts
      run: bun run test:integration:backward-compatibility
