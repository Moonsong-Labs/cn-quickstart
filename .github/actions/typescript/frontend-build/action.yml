name: Frontend build
description: >-
  Builds the frontend, including the OpenAPI client generation and the Vite
  bundle, then runs its unit tests.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup/bun
    - shell: bash
      run: bun run --filter frontend build
    - shell: bash
      run: bun run --filter frontend test
