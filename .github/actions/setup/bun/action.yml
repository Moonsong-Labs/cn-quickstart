name: Set up Bun
description: >-
  Installs the Bun version pinned in .bun-version, then installs workspace
  dependencies with a frozen lockfile. Leaves node_modules in the workspace.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - shell: bash
      run: bun install --frozen-lockfile
