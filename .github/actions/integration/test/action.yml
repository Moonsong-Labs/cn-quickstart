name: Integration test
description: >-
  Boots LocalNet and runs the Playwright licensing suite. Uploads the
  Playwright report on every run, and Compose logs when a step fails.

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: ./.github/actions/setup/bun
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
        cache-dependency-path: |
          quickstart/**/*.gradle*
          quickstart/**/*.gradle.kts
          quickstart/**/gradle-wrapper.properties
    - uses: ./.github/actions/setup/install-dpm
    - name: Configure Quickstart
      shell: bash
      working-directory: quickstart
      run: bun --no-env-file cli/src/main.ts setup --auth-mode oauth2 --party-hint quickstart-ci-1 --test-mode on --yes
    - name: Install Playwright
      shell: bash
      working-directory: quickstart
      run: make ci-install-playwright
    - name: Build
      shell: bash
      working-directory: quickstart
      run: make build
    - name: Start
      shell: bash
      working-directory: quickstart
      run: make start
    - name: Integration test
      shell: bash
      working-directory: quickstart
      run: make integration-test
    - name: Capture compose logs
      if: failure()
      shell: bash
      working-directory: quickstart
      run: make logs > "${RUNNER_TEMP}/compose-logs.txt" || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: compose-logs
        path: ${{ runner.temp }}/compose-logs.txt
        if-no-files-found: ignore
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: playwright-report
        path: quickstart/integration-test/playwright-report/
        if-no-files-found: ignore
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: playwright-results
        path: |
          quickstart/integration-test/test-results/
          quickstart/integration-test/results.xml
        if-no-files-found: ignore
    - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always() && hashFiles('quickstart/integration-test/results.xml') != ''
      with:
        name: Integration tests
        path: quickstart/integration-test/results.xml
        reporter: java-junit
